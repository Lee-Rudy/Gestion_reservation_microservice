services:
  api:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api_gateway
    ports:
      - "8000:8000"
    volumes:
      - ./api-gateway:/app
    depends_on:
      - auth-service
      - user-service
      - reservation-service
      - paiement-service

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth_service
    ports:
      - "8001:8001"
    volumes:
      - ./auth-service:/app
    depends_on:
      - user-service

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user_service
    ports:
      - "8002:8002"
    volumes:
      - ./user-service:/app

  reservation-service:
    build:
      context: ./reservation-service
      dockerfile: Dockerfile
    container_name: reservation_service
    ports:
      - "8003:8003"
    volumes:
      - ./reservation-service:/app
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=reservation_db
      - PAIEMENT_SERVICE_URL=http://paiement-service:8004
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./init-mysql.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  paiement-service:
    build:
      context: ./paiement-service
      dockerfile: Dockerfile
    container_name: paiement_service
    ports:
      - "8004:8004"
    volumes:
      - ./paiement-service:/app
    environment:
      - USE_DATABASE=true
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=paiement_db
    depends_on:
      mysql:
        condition: service_healthy

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: front
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - API_GATEWAY_URL=http://api:8000
    depends_on:
      - api

  test:
    build:
      context: ./${TEST_SERVICE:-api-gateway}
      dockerfile: Dockerfile.test
    container_name: microservices_tests
    volumes:
      - ./${TEST_SERVICE:-api-gateway}:/app
      - ./htmlcov:/app/htmlcov
    environment:
      - PYTHONPATH=/app
      - PYTHONPATH=/src

volumes:
  mysql-data:
