[project]
name = "reservation-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Lee-Rudy",email = "120602756+Lee-Rudy@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mysql-connector-python>=8.0",
    "httpx>=0.27.0",
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=5.0.0"
httpx = ">=0.27.0"
flake8 = "^6.0.0"
black = "^24.0.0"
mypy = "^1.0.0"

[tool.poetry]
packages = [{include = "reservation_service", from = "src"}]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
# Les repositories MySQL et le client HTTP nécessitent une vraie
# infrastructure (DB, service distant) — exclus de la couverture unitaire.
omit = [
    "*/infrastructure/*/database.py",
    "*/infrastructure/category/category_repository_impl.py",
    "*/infrastructure/reservation/reservation_repositoryImpl.py",
    "*/infrastructure/paiement/paiement_http_client.py",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"