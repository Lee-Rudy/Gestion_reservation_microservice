name: Test all services

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - paiement-service
          - reservation-service
          - user-service
    name: Test ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies for ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          poetry install

      - name: Format check with black — ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          poetry run black --check src/ tests/

      - name: Lint with flake8 — ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          poetry run flake8 src/ tests/ --max-line-length=88 --ignore=E203,W503

      - name: Type check with mypy — ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          poetry run mypy src/ --ignore-missing-imports

      - name: Run tests with coverage — ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          poetry run pytest -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=80

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./${{ matrix.service }}/htmlcov/
          flags: ${{ matrix.service }}
          fail_ci_if_error: false
