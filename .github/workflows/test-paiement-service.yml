name: Test paiement-service

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'paiement-service/**'
      - '.github/workflows/test-paiement-service.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'paiement-service/**'

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Quality checks
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: |
          cd paiement-service
          poetry install

      - name: Format check with black
        run: |
          cd paiement-service
          poetry run black --check src/ tests/

      - name: Lint with flake8
        run: |
          cd paiement-service
          poetry run flake8 src/ tests/ --max-line-length=88 --ignore=E203,W503

      - name: Type check with mypy
        run: |
          cd paiement-service
          poetry run mypy src/ --ignore-missing-imports

  test:
    needs: quality
    runs-on: ubuntu-latest
    name: Tests & Coverage
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: |
          cd paiement-service
          poetry install

      - name: Run tests with coverage
        run: |
          cd paiement-service
          poetry run pytest -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=80

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./paiement-service/htmlcov/
          flags: paiement-service
          fail_ci_if_error: false
